<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Learning Universe LMS — Admin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <span class="brand-logo"><img src="assert/dashboard/trimmed/01_graduation_cap_logo.png" alt="Learning Universe logo" /></span>
        <span class="brand-text">
          <strong>Learning Universe</strong>
          <small>Admin Portal</small>
        </span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="admin-chip">
          <span class="avatar">A</span>
          <span><strong>Admin</strong><small>Super Administrator</small></span>
        </div>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" data-icon="menu"></button>
        <div class="top-search">
          <span data-icon="search"></span>
          <input type="search" placeholder="Search students, classes, materials…" id="globalSearch" />
        </div>
        <div class="top-actions">
          <button class="icon-btn" aria-label="Notifications" id="bellBtn"><span data-icon="bell"></span><i class="dot"></i></button>
          <div class="profile">
            <span class="avatar">A</span>
            <span class="profile-text"><strong>Admin</strong><small>admin@learninguniverse.edu</small></span>
          </div>
        </div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toast-root" id="toastRoot"></div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
